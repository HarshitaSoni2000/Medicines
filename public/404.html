<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Thock Medicine</title>
    <!--
      GitHub Pages SPA fallback (spa-github-pages technique).
      GitHub Pages serves this file for any unknown path (e.g. a refresh on /medicines).
      It re-encodes the real path into a query string and redirects to index.html,
      where the inline script in index.html restores it via history.replaceState.

      pathSegmentsToKeep = 1 assumes a PROJECT page, i.e. deployed at
      https://<username>.github.io/<repo-name>/ — the first path segment (repo name)
      is preserved. If you deploy at the domain root (a username.github.io "user site"
      or a custom domain), change this to 0.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
